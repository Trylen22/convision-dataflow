<style>

                 background: rgba(255,255,255,.06); color: var(--fg); display: grid; place-items: center; }

                      align-items: center; text-align: left; padding: 12px; margin: 0 0 6px; color: var(--fg);
                      background: rgba(255,255,255,.035); border: 1px solid var(--line); border-radius: 10px; }

  body.rot #bar { padding: 26px 18px 12px; }

        aria-label="Animated walkthrough: the PLC starts the conveyor, a photo-eye stops each part under the camera, the Jetson Nano classifies it, the class travels over Ethernet to the PLC, and the PLC drives the diverter into the matching bin."></canvas>
      <button id="big" type="button" aria-label="Play"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg><svg class="i-replay" viewBox="0 0 24 24"><path d="M12 5V1.5L7 6l5 4.5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>

<script>
(() => {
'use strict';
// =====================================================================
//  ConVision · data-flow overview
//  Everything is a pure function of time: render(t) draws one frame.
//  World time drives the physics; video time adds slow motion where
//  fast PLC signals need to be seen.
// =====================================================================
const W = 1920, H = 1080;
let RES = 1;
const cv = document.getElementById('v');
const g = cv.getContext('2d');
const FONT = '"Inter","Ubuntu Sans","Segoe UI",system-ui,sans-serif';
const MONO = '"JetBrains Mono","Ubuntu Sans Mono","SFMono-Regular",Consolas,monospace';

// ---------------------------------------------------------------- math
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = u => { u = clamp(u); return u * u * (3 - 2 * u); };
const ease = u => { u = clamp(u); return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const win = (t, a, b, fi = .45, fo = .45) => Math.min(seg(t, a, a + fi), 1 - seg(t, b - fo, b));
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const D2R = Math.PI / 180;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------------------------------------------------------------- palette
const C = {
  eth: '#8ea2ff', di: '#3ee07f', ao: '#c084fc', pwr: '#ff7a45', video: '#5fd8ff',
  bolt: '#3dd6f5', screw: '#ffb020', text: '#e8edf2', dim: '#8592a3', faint: '#4b5563',
  panel: 'rgba(10,14,20,.82)', line: 'rgba(255,255,255,.10)', red: '#ff4d5e',
};
const TYPE_COL = { eth: C.eth, di: C.di, ao: C.ao, pwr: C.pwr, video: C.video };
const hex2rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (c, a) => { const [r, gg, b] = typeof c === 'string' ? hex2rgb(c) : c; return `rgba(${r | 0},${gg | 0},${b | 0},${a})`; };

// ---------------------------------------------------------------- plant geometry
const X_TAIL = -7.0, X_HEAD = 4.2, ZB = 1.2, BW = 0.75;   // belt ends, belt top, half width
const XC = 1.4;                                            // camera station
const HALF = 0.45;                                         // half part length
const PITCH = 3.6;                                         // even spacing between parts
const PIV = 5.5, FIN_L = 1.2;                              // diverter pivot at the Y split, fin length upstream
const FIN_A = Math.asin(.56 / FIN_L);                      // fin swing: free end touches the closed branch wall
const zc = x => lerp(1.12, 0.92, clamp((x - 4.3) / 1.7));  // chute surface height
const BIN_Y = { bolt: -0.62, screw: 0.62 };

// ---------------------------------------------------------------- script (world time)
const EV = [], PK = [], RAMPS = [], FIN = [], WARPS = [], M = {};
const setTag = (t, k, v) => EV.push({ t, k, v });
const pkt = (link, t0, dur, label) => { PK.push({ link, t0, t1: t0 + dur, label }); return t0 + dur; };
const V = 1.0, ACC = 0.8, DEC = 0.4, LAT_DI = 0.2, LAT_SCAN = 0.04, LAT_DO = 0.16;

// belt distance S(t): integrate the ramp profile on a fine table
const DT = 1 / 500, HORIZON = 140;
let STAB = new Float64Array(1);
function vAt(t) { let v = 0; for (const r of RAMPS) { if (t < r.t0) break; v = t < r.t1 ? lerp(r.v0, r.v1, smooth((t - r.t0) / (r.t1 - r.t0))) : r.v1; } return v; }
function buildS() { RAMPS.sort((a, b) => a.t0 - b.t0); const n = Math.ceil(HORIZON / DT) + 2; STAB = new Float64Array(n);
  for (let i = 1; i < n; i++) STAB[i] = STAB[i - 1] + vAt((i - .5) * DT) * DT; }
function S(t) { const f = clamp(t, 0, HORIZON) / DT, i = Math.floor(f), u = f - i; return lerp(STAB[i], STAB[Math.min(i + 1, STAB.length - 1)], u); }
function findT(from, test) { for (let t = from; t < HORIZON; t += DT) if (test(t)) return t; return HORIZON; }

function stopSeq(trip) {
  let u = pkt('pe_di', trip, LAT_DI, 'DI 0 · PartPresent = 1'); setTag(u, 'PartPresent', 1);
  u += LAT_SCAN; setTag(u, 'Conveyor_Run', 0); const cmd = u;
  u = pkt('do_vfd', u, LAT_DO, 'DO 0 · Run = 0'); RAMPS.push({ t0: u, t1: u + DEC, v0: V, v1: 0 });
  WARPS.push({ t0: trip - 0.12, t1: u + DEC + 0.06, rate: 0.25 });
  return { cmd, stop: u + DEC };
}

// 01 · operator starts the line
M.hmi = 5.6;
let t = pkt('hmi', M.hmi + 0.15, 1.0, 'HMI_Start = 1');
setTag(t, 'HMI_Start', 1); setTag(t + 0.8, 'HMI_Start', 0); M.hmiAt = t;
t += 0.2; M.run1 = t; setTag(t, 'Conveyor_Run', 1);
const e1 = pkt('do_vfd', t, 0.55, 'DO 0 · Run = 1');
setTag(t + 0.2, 'Speed_Ref', 60); const e2 = pkt('ao_vfd', t + 0.2, 0.55, 'AO 0 · 60 %  (6.0 V)');
t = Math.max(e1, e2) + 0.1; t = pkt('vfd_motor', t, 0.8, '3-phase · 36 Hz');
M.beltStart = t; RAMPS.push({ t0: t, t1: t + ACC, v0: 0, v1: V });
// 02–03 · parts ride in, photo-eye trips
M.trip1 = M.beltStart + ACC + 3.2;
let r = stopSeq(M.trip1); M.stop1 = r.stop; M.stopCmd1 = r.cmd;
buildS();
const coast = S(M.stop1) - S(M.trip1);
const xB = XC - coast + HALF;                          // photo-eye beam, placed so the part stops under the lens
const parts = [{ cls: 'bolt', conf: 0.97 }, { cls: 'screw', conf: 0.95 }];
const bolt = parts[0], screw = parts[1];
bolt.x0 = XC - S(M.stop1); screw.x0 = bolt.x0 - PITCH;
// 04 · camera + Jetson
t = M.stop1 + 0.35; M.flash1 = t; pkt('cam_jet', t + 0.05, 0.6, 'frame · 1280×720');
M.feed1 = { t0: t + 0.6, k: 1, part: bolt }; M.feed1.t1 = M.feed1.t0 + 6.0;
// 05 · class travels to the PLC
t = M.feed1.t1 + 0.15;
M.eth1 = pkt('jet_plc', t, 1.8, 'Vision_Class = 1  ·  Seq 1'); setTag(M.eth1, 'Vision_Class', 1); setTag(M.eth1, 'Vision_Seq', 1);
pkt('jet_sql', t + 0.35, 1.9, 'INSERT detection · bolt');
// 06 · diverter
t = M.eth1 + 1.3; M.divCmd1 = t; setTag(t, 'Div_Cmd', 1);
t = pkt('do_div', t + 0.05, 1.1, 'DO 1 · Div_Cmd = 1'); FIN.push({ t0: t, t1: t + 0.7, a0: 0, a1: FIN_A }); M.swing1 = t;
t = pkt('prox1_di', t + 0.75, 0.8, 'DI 1 · Div_InPos = 1'); setTag(t, 'Div_InPos', 1); M.inpos1 = t;
t += 0.15; setTag(t, 'Conveyor_Run', 1); M.restart1 = t;
t = pkt('do_vfd', t, 0.35, 'DO 0 · Run = 1'); RAMPS.push({ t0: t, t1: t + ACC, v0: 0, v1: V });
buildS();
setTag(findT(M.restart1, u => bolt.x0 + S(u) - HALF > xB), 'PartPresent', 0);
bolt.tLeave = findT(M.restart1, u => bolt.x0 + S(u) >= X_HEAD);
// 08 · the screw, one pitch behind
M.trip2 = findT(M.restart1, u => screw.x0 + S(u) + HALF >= xB);
r = stopSeq(M.trip2); M.stop2 = r.stop; M.stopCmd2 = r.cmd;
buildS();
const DIS_T = 1.5;
bolt.tLand = bolt.tLeave + DIS_T; setTag(bolt.tLand, 'Cnt_Bolt', 1);
t = M.stop2 + 0.3; M.flash2 = t; pkt('cam_jet', t + 0.05, 0.5, 'frame · 1280×720');
M.feed2 = { t0: t + 0.5, k: 0.75, part: screw }; M.feed2.t1 = M.feed2.t0 + 6.0 * 0.75;
t = M.feed2.t1 + 0.15;
M.eth2 = pkt('jet_plc', t, 1.4, 'Vision_Class = 2  ·  Seq 2'); setTag(M.eth2, 'Vision_Class', 2); setTag(M.eth2, 'Vision_Seq', 2);
pkt('jet_sql', t + 0.3, 1.5, 'INSERT detection · screw');
t = M.eth2 + 1.0; M.divCmd2 = t; setTag(t, 'Div_Cmd', 2);
t = pkt('do_div', t + 0.05, 0.9, 'DO 2 · Div_Cmd = 2'); setTag(t, 'Div_InPos', 0); FIN.push({ t0: t, t1: t + 0.8, a0: FIN_A, a1: -FIN_A }); M.swing2 = t;
t = pkt('prox2_di', t + 0.85, 0.7, 'DI 2 · Div_InPos = 1'); setTag(t, 'Div_InPos', 1); M.inpos2 = t;
t += 0.15; setTag(t, 'Conveyor_Run', 1); M.restart2 = t;
t = pkt('do_vfd', t, 0.35, 'DO 0 · Run = 1'); RAMPS.push({ t0: t, t1: t + ACC, v0: 0, v1: V });
buildS();
setTag(findT(M.restart2, u => screw.x0 + S(u) - HALF > xB), 'PartPresent', 0);
screw.tLeave = findT(M.restart2, u => screw.x0 + S(u) >= X_HEAD);
screw.tLand = screw.tLeave + DIS_T; setTag(screw.tLand, 'Cnt_Screw', 1);
// 09 · recap
M.summary = screw.tLand + 1.2;
const RECAP = [
  ['hmi', 'HMI → PLC', 'Ethernet · start command'],
  ['do_vfd', 'PLC → drive', 'DO 0 run  +  AO 0 speed'],
  ['vfd_motor', 'Drive → motor', '3-phase power'],
  ['pe_di', 'Photo-eye → PLC', 'DI 0 part present'],
  ['cam_jet', 'Camera → Jetson', 'video frame'],
  ['jet_plc', 'Jetson → PLC', 'Vision_Class 1 / 2'],
  ['do_div', 'PLC → diverter', 'DO 1 / DO 2'],
  ['prox1_di', 'Diverter → PLC', 'DI 1 / DI 2 in position'],
  ['jet_sql', 'Jetson + PLC → SQL', 'detections, counts, status'],
];
RECAP.forEach((rc, i) => { pkt(rc[0], M.summary + 0.9 + i * 0.85, 0.9, String(i + 1)); if (rc[0] === 'jet_sql') pkt('plc_sql', M.summary + 0.9 + i * 0.85, 0.9, String(i + 1)); });
M.endCard = M.summary + 0.9 + RECAP.length * 0.85 + 2.2;
M.end = M.endCard + 5.5;
EV.sort((a, b) => a.t - b.t);

// ---------------------------------------------------------------- video time ⇄ world time
WARPS.sort((a, b) => a.t0 - b.t0);
const PACE = 0.62;                                       // world seconds per video second
function videoFromWorld(tw) { let tv = tw; for (const w of WARPS) tv += Math.max(0, Math.min(tw, w.t1) - w.t0) * (1 / w.rate - 1); return tv / PACE; }
function worldFromVideo(tv) { let lo = 0, hi = M.end; for (let i = 0; i < 50; i++) { const mid = (lo + hi) / 2; videoFromWorld(mid) < tv ? lo = mid : hi = mid; } return (lo + hi) / 2; }
const DURATION = videoFromWorld(M.end);
const slowMo = tw => WARPS.some(w => tw > w.t0 && tw < w.t1);

// ---------------------------------------------------------------- tags
const TAGS = [
  ['HMI_Start', 'BOOL', 'HMI'],
  ['Conveyor_Run', 'BOOL', 'DO 0'],
  ['Speed_Ref', 'REAL', 'AO 0', v => v.toFixed(1) + ' %'],
  ['PartPresent', 'BOOL', 'DI 0'],
  ['Vision_Class', 'INT', 'Jetson', v => v === 1 ? '1 · bolt' : v === 2 ? '2 · screw' : '0'],
  ['Vision_Seq', 'INT', 'Jetson'],
  ['Div_Cmd', 'INT', 'DO 1/2', v => v === 1 ? '1 · Bin 1' : v === 2 ? '2 · Bin 2' : '0'],
  ['Div_InPos', 'BOOL', 'DI 1/2'],
  ['Cnt_Bolt', 'DINT', 'PLC'],
  ['Cnt_Screw', 'DINT', 'PLC'],
];
function tag(k, tw) { let v = 0, at = -99; for (const e of EV) { if (e.t > tw) break; if (e.k === k) { v = e.v; at = e.t; } } return { v, at }; }

// ---------------------------------------------------------------- cables (world polylines)
const zcd = zc(PIV) + 0.46, zpr = zc(4.45) + .12;
const LINKS = {
  hmi:       { type: 'eth', pts: [[-2.6, 2.34, 1.25], [-2.6, 2.34, .03], [2.45, 2.34, .03], [2.45, 2.72, .03], [2.45, 2.72, .6], [2.52, 2.8, 2.12]] },

█████╗  ███╗   ██╗", "       ██╔════╝ ██╔═══██╗ ████╗  ██║ ██║   ██║ ██║ ██╔════╝ ██║ ██╔═══██╗ ████╗  ██║", "       ██║      ██║   ██║ ██╔██╗ ██║ ██║   ██║ ██║ ███████╗ ██║ ██║   ██║ ██╔██╗ ██║", "       ██║      ██║   ██║ ██║╚██╗██║ ╚██╗ ██╔╝ ██║ ╚════██║ ██║ ██║   ██║ ██║╚██╗██║", "       ╚██████╗ ╚██████╔╝ ██║ ╚████║  ╚████╔╝  ██║ ███████║ ██║ ╚██████╔╝ ██║ ╚████║", "        ╚═════╝  ╚═════╝  ╚═╝  ╚═══╝   ╚═══╝   ╚═╝ ╚══════╝ ╚═╝  ╚═════╝  ╚═╝  ╚═══╝", "      ═══════════════════════════════════════════════════════════════════════════════", "                V I S I O N - G U I D E D   C O N V E Y O R   S O R T I N G", "                    Jetson Nano  ▸  PLC  ▸  Diverter  ▸  Ignition SCADA"];

function drawLogo(cx, top, size, reveal = 1) {            // team logo, drawn as text like logo.txt
  g.save(); g.font = `${size}px ${LOGO_FONT}`; g.textAlign = 'left'; g.textBaseline = 'top'; g.fillStyle = '#e6e6e6';

const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

// ---------------------------------------------------------------- frame
function render(tv) {
  const tw = worldFromVideo(clamp(tv, 0, DURATION));
  setCam(camAt(tw));
  g.setTransform(RES, 0, 0, RES, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  items = []; glows = []; texts = [];
  drawFloor(tw);
  drawPlant(tw);
  drawCables(tw);
  for (const q of parts) drawPart(q, tw);
  flush();
  drawPackets(tw);
  drawSpacing(tw);
  drawCallouts(tw);
  const vg = g.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.7)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  const tb = g.createLinearGradient(0, 0, 0, 240); tb.addColorStop(0, 'rgba(0,0,0,.78)'); tb.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = tb; g.fillRect(0, 0, W, 240);
  const bb = g.createLinearGradient(0, H - 130, 0, H); bb.addColorStop(0, 'rgba(0,0,0,0)'); bb.addColorStop(1, 'rgba(0,0,0,.8)'); g.fillStyle = bb; g.fillRect(0, H - 130, W, 130);
  drawTags(tw); drawRecap(tw); drawCounts(tw); drawLegend(tw);
  drawFeed(tw, M.feed1); drawFeed(tw, M.feed2);
  drawTitle(tw); drawTitleCard(tw); drawEndCard(tw);
}

// ---------------------------------------------------------------- playback (mobile page)
const q = new URLSearchParams(location.search);
window.__duration = DURATION; window.__render = render;
const $ = id => document.getElementById(id);
const body = document.body, stage = $('stage'), seek = $('seek'), clock = $('clock'), fill = $('fill');
let tv = clamp(+q.get('t') || 0, 0, DURATION), playing = true, dirty = true, last = performance.now();
let scrubbing = false, wasPlaying = false, hideAt = 0;

// Draw at the screen's real pixel count (at most 1920 wide) so phones don't paint 2 MP every frame.
function fit() {
  const w = cv.offsetWidth || W;
  const res = clamp(Math.ceil(w * (devicePixelRatio || 1) / W * 10) / 10, .4, 1);
  if (res !== RES) { RES = res; cv.width = Math.round(W * res); cv.height = Math.round(H * res); }
  dirty = true;
}

const sideways = matchMedia('(orientation: landscape) and (max-height: 600px)');
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
// Our own full-screen mode works everywhere (iPhone Safari has no page full screen);
// native full screen is layered on top where the browser allows it.
let full = false, wentNative = false;
function layout() {
  if (full && wentNative && !fsEl()) { full = false; wentNative = false; }
  body.classList.toggle('full', full);
  body.classList.toggle('imm', full || sideways.matches || !!fsEl());
  body.classList.toggle('rot', full && innerHeight > innerWidth);
  requestAnimationFrame(fit);
}
sideways.addEventListener ? sideways.addEventListener('change', layout) : sideways.addListener(layout);
addEventListener('resize', layout);
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, layout));

function poke() { hideAt = performance.now() + 2600; body.classList.add('ui'); }
function setPlaying(p) {
  if (p && tv >= DURATION) tv = 0;
  playing = p; body.classList.toggle('playing', p); body.classList.toggle('ended', !p && tv >= DURATION);
  $('play').setAttribute('aria-label', p ? 'Pause' : 'Play'); poke();
}
cv.addEventListener('click', () => {
  if (body.classList.contains('imm') && !body.classList.contains('ui')) poke(); else setPlaying(!playing);
});
$('big').onclick = () => setPlaying(true);
$('play').onclick = () => setPlaying(!playing);
seek.addEventListener('input', () => {
  if (!scrubbing) { scrubbing = true; wasPlaying = playing; playing = false; }
  tv = seek.value / 1000 * DURATION; dirty = true; poke();
});
seek.addEventListener('change', () => { scrubbing = false; setPlaying(wasPlaying); });

function setFull(on) {
  full = on; wentNative = false; layout(); poke();
  if (on) {
    const req = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
    if (req && (document.fullscreenEnabled || document.webkitFullscreenEnabled)) {
      Promise.resolve(req.call(document.documentElement))
        .then(() => { wentNative = true; return screen.orientation && screen.orientation.lock('landscape'); })
        .catch(() => {}).then(layout);
    }
    scrollTo(0, 0);
  } else if (fsEl()) {
    try { screen.orientation && screen.orientation.unlock(); } catch (e) {}
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
}
$('fs').onclick = () => setFull(!full);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.code === 'ArrowRight') { tv = Math.min(DURATION, tv + 5); dirty = true; }
  else if (e.code === 'ArrowLeft') { tv = Math.max(0, tv - 5); dirty = true; }
  else if (e.key === 'f') $('fs').click();
  else if (e.key === 'Escape' && full) setFull(false);
});

// chapters come straight from the animation's own step titles
const CH = [['00', 'How one part gets sorted', 'ConVision at a glance', 0]]
  .concat(STEPS.map(s => [s[2], s[3], s[4], videoFromWorld(s[0]())]))
  .concat([['10', 'Sense, see, decide, sort', 'The whole loop in four words', videoFromWorld(M.endCard)]]);
const rows = CH.map(c => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button';
  b.innerHTML = `<span class="n">${c[0]}</span><span><b></b><small></small></span><span class="at">${fmt(c[3])}</span><i></i>`;
  b.querySelector('b').textContent = c[1]; b.querySelector('small').textContent = c[2];
  b.onclick = () => { tv = c[3] + .01; dirty = true; setPlaying(true); stage.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  li.appendChild(b); $('chapters').appendChild(li); return li;
});
let cur = -1;
function showChapter() {
  let k = 0; CH.forEach((c, i) => { if (tv >= c[3]) k = i; });
  if (k !== cur) {
    if (cur >= 0) { rows[cur].classList.remove('on'); rows[cur].querySelector('i').style.width = '0'; }
    cur = k; rows[k].classList.add('on');
    $('nowN').textContent = CH[k][0]; $('nowT').textContent = CH[k][1]; $('nowS').textContent = CH[k][2];
  }
  const end = k + 1 < CH.length ? CH[k + 1][3] : DURATION;
  rows[k].querySelector('i').style.width = (100 * clamp((tv - CH[k][3]) / (end - CH[k][3]))) + '%';
}

function tick(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (playing) { tv += dt; dirty = true; if (tv >= DURATION) { tv = DURATION; setPlaying(false); } }
  if (dirty) {

    if (!scrubbing) seek.value = tv / DURATION * 1000;
